name: Publish GitHub Release

run-name: Publish a ${{ inputs.release_type }} release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    name: Version, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require the main branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" != "main" ]; then
            echo "Select the main branch when running this workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump and synchronize version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")

          VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");
          const path = "public/manifest.json";
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          manifest.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          NODE

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify synchronized versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          MANIFEST_VERSION=$(node -p "require('./public/manifest.json').version")

          test "$PACKAGE_VERSION" = "$VERSION"
          test "$LOCK_VERSION" = "$VERSION"
          test "$MANIFEST_VERSION" = "$VERSION"

      - name: Build extension
        run: npm run build

      - name: Create and verify archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="tving-kbo-plus-v$VERSION.zip"
          (cd dist && zip -qr "../$ARCHIVE" .)

          ARCHIVE_VERSION=$(unzip -p "$ARCHIVE" manifest.json | node -e '
            const fs = require("node:fs");
            process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version);
          ')
          test "$ARCHIVE_VERSION" = "$VERSION"

          echo "path=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tving-kbo-plus-v${{ steps.version.outputs.version }}
          path: ${{ steps.archive.outputs.path }}
          retention-days: 30

      - name: Commit version and create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          git commit -m "chore: release ${TAG}"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: |
          gh release create "$TAG" "$ARCHIVE#Chrome extension build" \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
